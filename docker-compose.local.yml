services:
  mongo:
    image: mongo:7
    container_name: ubuy-local-mongo
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: ubuy_loadtest
    volumes:
      - mongo_data_local:/data/db

  redis:
    image: redis:7-alpine
    container_name: ubuy-local-redis
    command: redis-server --appendonly yes --save 60 1
    ports:
      - '6379:6379'
    volumes:
      - redis_data_local:/data

volumes:
  mongo_data_local:
  redis_data_local:
