name: Secret Rotation Freshness

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  validate-secret-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_SECRET_ROTATED_AT: ${{ vars.JWT_SECRET_ROTATED_AT }}
      PAYMENT_WEBHOOK_SECRET_ROTATED_AT: ${{ vars.PAYMENT_WEBHOOK_SECRET_ROTATED_AT }}
      MAX_SECRET_AGE_DAYS: '90'

    steps:
      - name: Validate rotation timestamps are configured
        shell: bash
        run: |
          if [ -z "$JWT_SECRET_ROTATED_AT" ]; then
            echo "::error::Missing repository variable JWT_SECRET_ROTATED_AT (YYYY-MM-DD)."
            exit 1
          fi
          if [ -z "$PAYMENT_WEBHOOK_SECRET_ROTATED_AT" ]; then
            echo "::error::Missing repository variable PAYMENT_WEBHOOK_SECRET_ROTATED_AT (YYYY-MM-DD)."
            exit 1
          fi

      - name: Enforce maximum secret age
        shell: bash
        run: |
          check_secret_age() {
            local secret_name="$1"
            local rotated_at="$2"

            local rotated_epoch
            rotated_epoch=$(date -d "$rotated_at" +%s 2>/dev/null || true)
            if [ -z "$rotated_epoch" ]; then
              echo "::error::${secret_name} timestamp '${rotated_at}' is invalid. Use YYYY-MM-DD."
              exit 1
            fi

            local now_epoch
            now_epoch=$(date +%s)
            local age_days
            age_days=$(( (now_epoch - rotated_epoch) / 86400 ))

            if [ "$age_days" -gt "$MAX_SECRET_AGE_DAYS" ]; then
              echo "::error::${secret_name} is ${age_days} days old. Rotate secrets and update repository variables."
              exit 1
            fi

            echo "${secret_name} age check passed (${age_days} days old)."
          }

          check_secret_age "JWT_SECRET" "$JWT_SECRET_ROTATED_AT"
          check_secret_age "PAYMENT_WEBHOOK_SECRET" "$PAYMENT_WEBHOOK_SECRET_ROTATED_AT"
